name: Update PulsePress live news
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pulsepress-newsroom-v10
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh publisher feeds
        run: python3 scripts/update-news.py
      - name: Keep the latest editions
        run: |
          git config user.name 'PulsePress Newsroom'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher editions and weekly gaming highlights'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp *.html *.webmanifest sw.js _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed news
        id: deployment
        uses: actions/deploy-pages@v4
