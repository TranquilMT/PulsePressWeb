name: Update PulsePress live news
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: write
concurrency:
  group: pulsepress-newsroom-v10-2
  cancel-in-progress: true
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Refresh publisher feeds
        run: python3 scripts/update-news.py
      - name: Keep the latest editions
        run: |
          git config user.name 'PulsePress Newsroom'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher editions and weekly gaming highlights'
            git push origin HEAD:main
          fi
